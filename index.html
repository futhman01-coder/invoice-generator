
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice & Receipt Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;padding:20px}
header{text-align:center;margin-bottom:25px}
header h1{color:#173b68;margin-bottom:6px}
.container{max-width:850px;margin:auto}
.panel,.paper{background:white;padding:22px;border-radius:12px;margin-bottom:20px}
h2{font-size:19px;color:#173b68}
label{display:block;font-size:14px;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:7px;font-size:15px}
textarea{min-height:65px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .item-row{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:10px;
align-items:end;
margin-bottom:15px;
}
@media(max-width:500px){
.item-row{grid-template-columns:1fr}
}
button{padding:13px;border:0;border-radius:7px;background:#173b68;color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:15px}
button.secondary{background:#16835b}
.paper h2{text-align:center;font-size:25px}
.paper-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.line{border-bottom:1px solid #ddd;padding:10px 0}
.total{text-align:right;font-size:20px;font-weight:bold;margin-top:20px}
.muted{color:#64748b;font-size:13px}
@media(max-width:500px){.grid{grid-template-columns:1fr}body{padding:10px}}
@media print{
body{background:white;padding:0}
header,.form-panel,.actions{display:none!important}
.paper{box-shadow:none;margin:0;padding:15px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Invoice & Receipt Generator</h1>
<p>Create professional invoices and receipts for your business.</p>
</header>

<div class="panel form-panel">
<h2>Create your document</h2>
<label>Select Currency</label>
<select id="currency" onchange="update()">
<option value="NGN">Nigerian Naira (₦)</option>
<option value="USD">US Dollar ($)</option>
<option value="EUR">Euro (€)</option>
<option value="GBP">British Pound (£)</option>
<option value="CNY">Chinese Yuan (¥)</option>
<option value="JPY">Japanese Yen (¥)</option>
<option value="CAD">Canadian Dollar (C$)</option>
<option value="AUD">Australian Dollar (A$)</option>
<option value="GHS">Ghanaian Cedi (GH₵)</option>
<option value="ZAR">South African Rand (R)</option>
<option value="KES">Kenyan Shilling (KSh)</option>
<option value="INR">Indian Rupee (₹)</option>
<option value="AED">UAE Dirham (د.إ)</option>
<option value="SAR">Saudi Riyal (﷼)</option>
<option value="NONE">No Currency Symbol</option>
</select>
<label>Document type</label>
<select id="type" onchange="update()">
<option>INVOICE</option>
<option>RECEIPT</option>
</select>

<div class="grid">
<div>
<label>Business name</label>
<input id="business" placeholder="Your business name" oninput="update()">
</div>
<div>
<label>Customer name</label>
<input id="customer" placeholder="Customer name" oninput="update()">
</div>
<div>
<label>Document number</label>
<input id="number" value="INV-001" oninput="update()">
</div>
<div>
<label>Date</label>
<input id="date" type="date" oninput="update()">
</div>
</div>

<label>Business address / contact</label>
<input id="contact" placeholder="Address, phone or email" oninput="update()">

<div id="items">
  <div class="item-row">
    <div>
      <label>Item description</label>
      <input class="item-name" placeholder="e.g. Website design" oninput="update()">
    </div>
    <div>
      <label>Quantity</label>
      <input class="item-quantity" type="number" min="0" value="1" oninput="update()">
    </div>
    <div>
      <label>Price per item</label>
      <input class="item-price" type="number" min="0" value="0" oninput="update()">
    </div>
  </div>
</div>

<button type="button" onclick="addItem()">+ Add another item</button>

<label>Additional notes</label>
<textarea id="notes" placeholder="Thank you for your business!" oninput="update()"></textarea>

<div class="actions">
<button class="secondary" onclick="window.print()">Print / Save as PDF</button>
</div>
</div>

<div class="paper">
<div class="paper-top">
<div>
<h2 id="businessView">YOUR BUSINESS</h2>
<p id="contactView" class="muted"></p>
</div>
<div>
<h2 id="typeView">INVOICE</h2>
<p>Number: <span id="numberView"></span></p>
<p>Date: <span id="dateView"></span></p>
</div>
</div>

<hr>
<p><strong>Bill to:</strong> <span id="customerView">Customer name</span></p>
<hr>
<h3>Items</h3>
<div id="itemsView"></div>
<div class="total">TOTAL: <span id="totalView">0.00</span></div>
<hr>
<p id="notesView" class="muted">Thank you for your business!</p>
<p class="muted" style="text-align:center">Generated with Invoice & Receipt Generator</p>
</div>
</div>

<script>
  function addItem(){
const container=document.getElementById('items');
const row=document.createElement('div');
row.className='item-row';
row.innerHTML=`
<div>
<label>Item description</label>
<input class="item-name" placeholder="e.g. Website design" oninput="update()">
</div>
<div>
<label>Quantity</label>
<input class="item-quantity" type="number" min="0" value="1" oninput="update()">
</div>
<div>
<label>Price per item</label>
<input class="item-price" type="number" min="0" value="0" oninput="update()">
</div>`;
container.appendChild(row);
update();
  }
function update(){
const get=id=>document.getElementById(id).value;
const show=(id,value)=>document.getElementById(id).textContent=value;
const rows=[...document.querySelectorAll('.item-row')];
const currency=get('currency')||'NGN';
const money=n=>currency==='NONE'?n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}):new Intl.NumberFormat('en',{style:'currency',currency:currency,currencyDisplay:'symbol',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
show('businessView',get('business')||'YOUR BUSINESS');
show('contactView',get('contact'));
show('customerView',get('customer')||'Customer name');
show('typeView',get('type'));
show('numberView',get('number'));
show('dateView',get('date'));
const itemData=rows.map(row=>({
name:row.querySelector('.item-name').value,
quantity:Math.max(0,Number(row.querySelector('.item-quantity').value)||0),
price:Math.max(0,Number(row.querySelector('.item-price').value)||0)
}));
const total=itemData.reduce((sum,item)=>sum+item.quantity*item.price,0);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
document.getElementById('itemsView').innerHTML=itemData.map(item=>`<div class="line"><strong>${escapeHTML(item.name||'Item')}</strong><p>Quantity: ${item.quantity} | Unit price: ${money(item.price)}</p><p>Amount: ${money(item.quantity*item.price)}</p></div>`).join('');
show('totalView',money(total));
show('notesView',get('notes')||'Thank you for your business!');
}
document.getElementById('date').value=new Date().toISOString().slice(0,10);
update();
</script>
</body>
</html>
